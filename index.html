
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="남자의 일상을 바꾸는 가치 있는 발견">
<title>남자의 발견 | MEN'S PICK</title>
<style>
:root {
  --gold: #d4af37;
  --bg: #101010;
  --panel: #1c1c1c;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: #fff;
  font-family: "Malgun Gothic", Arial, sans-serif;
}
header {
  padding: 32px 16px;
  text-align: center;
  background: linear-gradient(145deg,#080808,#292317);
  border-bottom: 1px solid #66552d;
}
.logo {
  width: 110px;
  height: 110px;
  object-fit: contain;
  border-radius: 50%;
}
h1 {
  color: var(--gold);
  font-size: 38px;
  margin: 12px 0 6px;
}
.english {
  color: var(--gold);
  font-size: 17px;
  letter-spacing: 6px;
}
.slogan {
  color: #ddd;
  font-size: 16px;
  margin-top: 15px;
}
main {
  max-width: 1200px;
  margin: auto;
  padding: 24px;
}
.disclosure {
  color: #ccc;
  font-size: 13px;
  line-height: 1.7;
  padding: 12px 16px;
  border: 1px solid #444;
  border-radius: 8px;
  margin-bottom: 22px;
}
#search {
  width: 100%;
  padding: 19px;
  background: #222;
  color: white;
  border: 1px solid #776232;
  border-radius: 10px;
  font-size: 18px;
}
.categories {
  display: grid;
  grid-template-columns: repeat(8,1fr);
  gap: 9px;
  margin: 20px 0 30px;
}
.categories button {
  min-height: 48px;
  padding: 12px 6px;
  background: #242424;
  border: 1px solid #555;
  color: #eee;
  border-radius: 8px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}
.categories button.active {
  background: var(--gold);
  color: #111;
  border-color: var(--gold);
}
.section-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 18px;
}
.section-heading h2 {
  font-size: 25px;
  color: var(--gold);
  margin: 0;
}
#count {
  color: #bbb;
  font-size: 14px;
}
#products {
  display: grid;
  grid-template-columns: repeat(2,minmax(0,1fr));
  gap: 18px;
}
.product {
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 20px;
  background: var(--panel);
  border: 1px solid #51462d;
  border-radius: 14px;
}
.image-link {
  flex: 0 0 100px;
  display: block;
}
.image-link img {
  display: block;
  width: 100%;
  max-height: 200px;
  object-fit: contain;
}
.details {
  flex: 1;
  min-width: 0;
}
.number {
  color: var(--gold);
  font-size: 14px;
  font-weight: bold;
}
.product h2 {
  font-size: 21px;
  line-height: 1.5;
  margin: 9px 0;
  overflow-wrap: anywhere;
}
.description {
  color: #ccc;
  font-size: 15px;
  line-height: 1.75;
  margin: 10px 0 18px;
}
.buy {
  display: block;
  text-align: center;
  text-decoration: none;
  color: #111;
  background: var(--gold);
  font-size: 15px;
  font-weight: bold;
  padding: 14px 8px;
  border-radius: 8px;
}
.buy:hover {
  background: #efcc59;
}
.notice {
  color: #aaa;
  font-size: 11px;
  margin-top: 9px;
  text-align: center;
}
footer {
  text-align: center;
  padding: 30px 15px;
  margin-top: 30px;
  border-top: 1px solid #333;
  color: #aaa;
  font-size: 13px;
  line-height: 2.1;
}
footer a {
  color: var(--gold);
}
@media(max-width:900px) {
  #products {
    grid-template-columns: 1fr;
  }
  .categories {
    grid-template-columns: repeat(4,1fr);
  }
}
@media(max-width:600px) {
  header {
    padding: 24px 12px;
  }
  .logo {
    width: 88px;
    height: 88px;
  }
  h1 {
    font-size: 30px;
  }
  .english {
    font-size: 14px;
  }
  .slogan {
    font-size: 13px;
  }
  main {
    padding: 14px;
  }
  #search {
    font-size: 16px;
    padding: 16px;
  }
  .categories {
    gap: 6px;
    margin: 15px 0 24px;
  }
  .categories button {
    font-size: 13px;
    min-height: 44px;
  }
  .product {
    padding: 13px;
    gap: 12px;
  }
  .image-link {
    flex-basis: 88px;
  }
  .product h2 {
    font-size: 17px;
  }
  .description {
    font-size: 13px;
    line-height: 1.6;
  }
  .buy {
    font-size: 13px;
  }
  .section-heading h2 {
    font-size: 21px;
  }
}
</style>
</head>
<body>

<header>
  <img class="logo" src="images/logo.png"
       alt="남자의 발견"
       onerror="this.style.display='none'">
  <h1>남자의 발견</h1>
  <div class="english">MEN'S PICK</div>
  <div class="slogan">남자의 일상을 바꾸는 가치 있는 발견</div>
</header>

<main>
  <div class="disclosure">
    이 포스팅은 쿠팡 파트너스 활동의 일환으로,
    이에 따른 일정액의 수수료를 제공받습니다.
  </div>

  <input id="search" type="search"
    placeholder="상품번호 또는 상품명을 검색하세요"
    aria-label="상품 검색">

  <div class="categories" id="categories"></div>

  <div class="section-heading">
    <h2>최신 추천 상품</h2>
    <div id="count" aria-live="polite">불러오는 중</div>
  </div>

  <div id="products"></div>
</main>

<footer>
  MEN'S PICK | 남자의 발견<br>
  <a href="https://www.youtube.com/@menspick"
     target="_blank" rel="noopener noreferrer">YouTube</a>
  &nbsp; | &nbsp;
  <a href="https://www.instagram.com/men.spick/"
     target="_blank" rel="noopener noreferrer">Instagram</a>
  &nbsp; | &nbsp;
  <a href="https://www.facebook.com/profile.php?id=61596658090077"
     target="_blank" rel="noopener noreferrer">Facebook</a>
  &nbsp; | &nbsp;
  <a href="https://blog.naver.com/psk1552"
     target="_blank" rel="noopener noreferrer">Blog</a>
  <br>
  상품 가격과 재고는 판매처에서 확인해 주세요.<br>
  © MEN'S PICK
</footer>

<script>
let products = [];
let selected = "전체";

const categories = [
  "전체", "자동차", "공구", "디지털",
  "캠핑", "골프·스포츠", "생활용품",
  "프리미엄"
];

const categoryBox = document.getElementById("categories");
const searchBox = document.getElementById("search");
const productBox = document.getElementById("products");
const countBox = document.getElementById("count");

function validLink(value) {
  try {
    const url = new URL(value);
    if (
      url.protocol === "https:" &&
      ["link.coupang.com","www.coupang.com","coupa.ng"]
      .includes(url.hostname)
    ) {
      return url.href;
    }
  } catch(e) {}
  return null;
}

function setLink(element,url) {
  element.href = url;
  element.target = "_blank";
  element.rel = "sponsored noopener";
  element.referrerPolicy = "unsafe-url";
}

categories.forEach(category => {
  const button = document.createElement("button");
  button.textContent = category;
  button.classList.toggle("active", category === selected);
  button.onclick = () => {
    selected = category;
    categoryBox.querySelectorAll("button").forEach(b =>
      b.classList.toggle("active",b.textContent === selected)
    );
    render();
  };
  categoryBox.appendChild(button);
});

function render() {
  const keyword = searchBox.value.trim().toLowerCase();

  const filtered = products.filter(p => {
    const text = [
      p.id,p.name,p.model,p.category,p.description
    ].join(" ").toLowerCase();

    const matchNumber =
      /^\d+$/.test(keyword) &&
      Number(p.id) === Number(keyword);

    return (selected === "전체" || p.category === selected)
      && (text.includes(keyword) || matchNumber);
  });

  filtered.sort((a,b) => Number(b.id)-Number(a.id));

  productBox.replaceChildren();
  countBox.textContent = `추천 상품 ${filtered.length}개`;

  filtered.forEach(p => {
    const card = document.createElement("article");
    card.className = "product";

    const url = validLink(p.link);

    if (p.image) {
      const imageLink = document.createElement(
        url ? "a" : "div"
      );
      imageLink.className = "image-link";

      if (url) {
        setLink(imageLink, validLink(p.imageLink) || url);
      }

      const img = document.createElement("img");
      img.src = p.image;
      img.alt = p.name;
      img.loading = "lazy";
      img.onerror = () => imageLink.remove();

      imageLink.appendChild(img);
      card.appendChild(imageLink);
    }

    const details = document.createElement("div");
    details.className = "details";

    const number = document.createElement("div");
    number.className = "number";
    number.textContent = `NO. ${p.id} | ${p.category}`;

    const title = document.createElement("h2");
    title.textContent = p.name;

    const desc = document.createElement("p");
    desc.className = "description";
    desc.textContent = p.description;

    details.append(number,title,desc);

    if (url) {
      const buy = document.createElement("a");
      buy.className = "buy";
      setLink(buy,url);
      buy.textContent = "쿠팡 상품 확인 및 구매 →";
      details.appendChild(buy);
    }

    const notice = document.createElement("div");
    notice.className = "notice";
    notice.textContent = "가격 및 할인 혜택은 쿠팡에서 확인";
    details.appendChild(notice);

    card.appendChild(details);
    productBox.appendChild(card);
  });

  if (!filtered.length) {
    countBox.textContent = "해당 상품이 없습니다.";
  }
}

searchBox.addEventListener("input",render);

fetch("./products.json",{cache:"no-cache"})
  .then(response => {
    if (!response.ok) throw new Error("Load failed");
    return response.json();
  })
  .then(data => {
    if (!Array.isArray(data)) throw new Error("Invalid data");
    products = data;
    render();
  })
  .catch(() => {
    countBox.textContent = "상품 등록을 준비 중입니다.";
  });
</script>

</body>
</html>

  });
</script>

</body>
</html>
